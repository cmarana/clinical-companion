      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; background: #ffffff; }

      #pulso-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff;
        -webkit-tap-highlight-color: transparent;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        overflow: hidden;
        transition: opacity 420ms ease, visibility 0s linear 420ms;
        will-change: opacity;
      }
      #pulso-splash.pulso-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #pulso-splash.pulso-hide .pulso-logo {
        transform: scale(.96);
        opacity: 0;
        transition: transform 420ms ease, opacity 320ms ease;
      }

      html.pulso-splash-active, html.pulso-splash-active body { overflow: hidden; }

      #root.pulso-app-enter {
        animation: pulso-app-enter 480ms ease both;
      }
      @keyframes pulso-app-enter {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      #pulso-splash .pulso-logo {
        width: min(78vw, 360px);
        display: flex; align-items: center; justify-content: center;
        opacity: 0;
        animation: pulso-rise .7s cubic-bezier(.22,1,.36,1) .05s forwards;
      }
      #pulso-splash .pulso-logo svg { width: 100%; height: auto; display: block; }

      /* Linha de ECG desenha-se da esquerda para a direita */
      #pulso-splash .pulso-ecg-line {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: pulso-draw 1.4s cubic-bezier(.65,0,.35,1) .35s forwards;
      }
      /* Pulso sutil no ponto luminoso */
      #pulso-splash .pulso-dot {
        transform-origin: center;
        opacity: 0;
        animation: pulso-dot 1.6s ease-in-out 1.4s infinite;
      }

      @keyframes pulso-rise {
        0%   { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulso-draw { to { stroke-dashoffset: 0; } }
      @keyframes pulso-dot {
        0%, 100% { opacity: .9; transform: scale(1); }
        50%      { opacity: .35; transform: scale(.7); }
      }
      @media (prefers-reduced-motion: reduce) {
        #pulso-splash .pulso-logo,
        #pulso-splash .pulso-ecg-line,
        #pulso-splash .pulso-dot { animation: none; opacity: 1; stroke-dashoffset: 0; }
        #root.pulso-app-enter { animation: none; }
      }

    <script>
      // Splash hides when:
      //  (a) React app explicitly calls window.__pulsoHideSplash() after first paint, OR
      //  (b) #root gets any meaningful child node (fallback), OR
      //  (c) hard cap of 6s (safety net so user is never stuck)
      (function(){
        var splash = document.getElementById('pulso-splash');
        if (!splash) return;
        var hidden = false;
        var startedAt = Date.now();
        var MIN_SHOW_MS = 350;

        // Trava o scroll enquanto o splash está visível para evitar layout shift
        document.documentElement.classList.add('pulso-splash-active');

        function doHide(){
          if (hidden) return; hidden = true;
          // Dispara a entrada suave do app (fade + scale sutil) no MESMO frame
          // do início do fade-out do splash — sem layout shift, ambos cobrem
          // a mesma área (root é normal flow, splash é position:fixed).
          var root = document.getElementById('root');
          if (root) {
            root.classList.add('pulso-app-enter');
            // Remove a classe após a animação para não interferir com o app
            setTimeout(function(){ root.classList.remove('pulso-app-enter'); }, 700);
          }
          splash.classList.add('pulso-hide');
          setTimeout(function(){
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            document.documentElement.classList.remove('pulso-splash-active');
          }, 560);
        }
        function hide(){
          var elapsed = Date.now() - startedAt;
          if (elapsed < MIN_SHOW_MS) {
            setTimeout(doHide, MIN_SHOW_MS - elapsed);
          } else {
            doHide();
          }
        }

        window.__pulsoHideSplash = hide;

        // Fallback: hide as soon as React renders ANY content into root
        var root = document.getElementById('root');
        if (root && 'MutationObserver' in window) {
          var obs = new MutationObserver(function(){
            if (root.childNodes.length > 0) {
              // Wait one more frame so React has time to paint before fading out
              requestAnimationFrame(function(){
                requestAnimationFrame(function(){ obs.disconnect(); hide(); });
              });
            }
          });
          obs.observe(root, { childList: true });
        }

        // Do not hide the splash unless React has rendered content. If startup
        // fails, keep the branded recovery UI visible instead of a blank screen.
        setTimeout(function(){
          if (root && root.childNodes.length > 0) hide();
        }, 4500);

        function showError(reason){
          if (!splash || !splash.parentNode) return;
          splash.classList.remove('pulso-hide');
          splash.style.opacity = '1';
          splash.style.visibility = 'visible';
          splash.innerHTML = '<div style="text-align:center;font-family:-apple-system,sans-serif;color:#0a1628;padding:24px;max-width:340px"><div style="font-weight:800;letter-spacing:.2em;font-size:20px;margin-bottom:12px;color:#0a6dd9">PULSO</div><div style="font-size:14px;line-height:1.5;margin-bottom:16px">Não foi possível carregar o aplicativo. Toque em recarregar para tentar novamente.</div><button id="pulso-reload" style="background:#0a6dd9;color:#fff;border:0;padding:12px 24px;border-radius:10px;font-weight:600;font-size:14px">Recarregar</button><div style="font-size:10px;color:#64748b;margin-top:12px;opacity:.7">' + (reason || '') + '</div></div>';
          var btn = document.getElementById('pulso-reload');
          if (btn) btn.onclick = function(){
            try {
              if ('caches' in window) caches.keys().then(function(k){ k.forEach(function(n){ caches.delete(n); }); });
              if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(r){ r.forEach(function(x){ x.unregister(); }); });
            } catch(e) {}
            setTimeout(function(){ location.reload(); }, 150);
          };
        }

        // If the JS bundle itself errors out (e.g. TDZ in a vendor chunk),
        // show the recovery screen IMMEDIATELY instead of waiting 10s.
        window.addEventListener('error', function(ev){
          if (root && root.childNodes.length === 0) {
            showError(ev && ev.message ? ev.message : 'Erro de carregamento');
          }
        });
        window.addEventListener('unhandledrejection', function(ev){
          if (root && root.childNodes.length === 0) {
            var msg = ev && ev.reason && ev.reason.message ? ev.reason.message : 'Falha ao carregar';
            showError(msg);
          }
        });

        // Last-resort: if main script fails to ever render anything in 8s
        setTimeout(function(){
          if (root && root.childNodes.length === 0) showError('Tempo esgotado');
        }, 8000);
      })();
    </script>
    <script>
      // Emergency SW cleanup for preview/iframe — runs before React
      (function(){
        try {
          var isPreview = location.hostname.indexOf('id-preview--') !== -1 || location.hostname.indexOf('lovableproject.com') !== -1;
          var isIframe = false;
          try { isIframe = window.self !== window.top; } catch(e) { isIframe = true; }
          if ((isPreview || isIframe) && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
          }
        } catch(e) {}
      })();
    </script>
    <script>
      // Pre-React no-SW cache-busting fallback.
      // Runs in EVERY environment (incognito, SW disabled, old browsers, CDNs that
      // ignore Cache-Control). Compares the BUILD_ID stamped into this HTML against
      // the live /version.json. On mismatch, hard-reloads with a versioned query
      // string so the browser pulls a fresh shell instead of a cached one.
      (function(){
        function emit(name, params){
          try { console.info('[pulso:version] ' + name, params || {}); } catch(e) {}
          try {
            if (typeof window.gtag === 'function') {
              window.gtag('event', name, Object.assign({ event_category: 'build_version', source: 'inline_probe' }, params || {}));
            }
          } catch(e) {}
        }
        try {
          var meta = document.querySelector('meta[name="pulso-build-id"]');
          var current = meta ? meta.getAttribute('content') : '';
          // If the token wasn't replaced, we're in dev/preview — skip.
          if (!current || current.indexOf('__BUILD') === 0) return;

          // Avoid reload loops: if URL already has ?v= within last 60s, bail.
          var url = new URL(location.href);
          var lastBust = parseInt(url.searchParams.get('v') || '0', 10);
          if (lastBust && (Date.now() - lastBust) < 60000) {
            emit('version_reload_skipped', { reason: 'cooldown', current_build: current });
            return;
          }

          emit('version_check_started', { trigger: 'inline_probe', current_build: current });
          fetch('/version.json?_=' + Date.now(), { cache: 'no-store', credentials: 'omit' })
            .then(function(r){
              if (!r.ok) { emit('version_check_failed', { reason: 'http', status: r.status }); return null; }
              return r.json();
            })
            .then(function(data){
              if (!data || !data.buildId) return;
              if (data.buildId === current) {
                emit('version_check_ok', { current_build: current, remote_build: data.buildId });
                return;
              }
              emit('build_update_detected', { current_build: current, remote_build: data.buildId, source: 'inline_probe' });
              // If React has mounted, defer to the in-app confirmation modal.
              // The inline probe should only force-reload when the bundle itself
              // failed to boot (stale HTML pinning users to a dead build).
              var deadline = Date.now() + 12000;
              (function waitForReact(){
                if (window.__pulsoReactMounted) {
                  emit('inline_probe_deferred_to_react', { remote_build: data.buildId });
                  return; // React watcher will dispatch the modal event
                }
                if (Date.now() > deadline) {
                  // Bundle never mounted — force reload as last resort
                  try {
                    if ('caches' in window) {
                      emit('cache_purge_started', { source: 'inline_probe' });
                      caches.keys().then(function(keys){
                        Promise.all(keys.map(function(k){ return caches.delete(k).catch(function(){ return false; }); }))
                          .then(function(results){
                            emit('cache_purge_completed', { caches_cleared: results.filter(Boolean).length, source: 'inline_probe' });
                          });
                      });
                    }
                  } catch(e) {
                    emit('cache_purge_failed', { message: String(e && e.message || e) });
                  }
                  var next = new URL(location.href);
                  next.searchParams.set('v', Date.now().toString());
                  emit('version_reload_triggered', { remote_build: data.buildId, source: 'inline_probe_fallback' });
                  location.replace(next.toString());
                  return;
                }
                setTimeout(waitForReact, 500);
              })();
            })
            .catch(function(err){
              emit('version_check_failed', { reason: 'network', message: String(err && err.message || err) });
            });
        } catch(e) {
          emit('version_check_failed', { reason: 'exception', message: String(e && e.message || e) });
        }
      })();
    </script>
