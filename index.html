    <script>
      // Detecta tema salvo (light/dark/oled) ou prefers-color-scheme do sistema.
      (function(){
        try {
          var stored = localStorage.getItem('app-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (stored === 'light' || stored === 'dark' || stored === 'oled')
            ? stored
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-splash-theme', theme);
        } catch(e) {
          document.documentElement.setAttribute('data-splash-theme', 'light');
        }
      })();

      #pulso-splash .pulso-ecg {
        position: absolute; bottom: 16%; left: 50%; transform: translateX(-50%);

      }
      #pulso-splash .pulso-ecg svg { width: 100%; height: 100%; display: block; }

        stroke-linecap: round; stroke-linejoin: round;

        animation: pulso-ecg 1.8s linear infinite;
        filter: drop-shadow(0 0 6px var(--pulso-accent-glow));
      }
      /* Ponto luminoso percorrendo o ECG */
      #pulso-splash .pulso-spark {
        position: absolute; bottom: 16%; left: 50%;
        width: 10px; height: 10px; margin-bottom: 12px;
        border-radius: 50%;
        background: var(--pulso-accent-glow);
        box-shadow: 0 0 12px var(--pulso-accent-glow), 0 0 24px var(--pulso-accent);
        opacity: 0;
        animation: pulso-spark 1.8s linear .8s infinite;
      }

      @keyframes pulso-pop {
        0% { transform: scale(.6) rotate(-6deg); opacity: 0; }
        60% { transform: scale(1.06) rotate(2deg); opacity: 1; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
      }
      @keyframes pulso-beat {

        24% { transform: scale(1); }
        36% { transform: scale(1.04); }

      }
      @keyframes pulso-rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes pulso-fade { to { opacity: 1; } }
      @keyframes pulso-ecg { to { stroke-dashoffset: 0; } }

        50% { opacity: 1; transform: translate(-50%, -62%) scale(1.12); }
      }
      @keyframes pulso-ripple {
        0% { opacity: .8; transform: translate(0, -22%) scale(.6); }
        100% { opacity: 0; transform: translate(0, -22%) scale(2.4); }
      }
      @keyframes pulso-spark {
        0% { opacity: 0; transform: translateX(-130px); }

        90% { opacity: 1; }
        100% { opacity: 0; transform: translateX(130px); }
      }

        #pulso-splash::before,
        #pulso-splash .pulso-ring,

      //  (a) React app explicitly calls window.__pulsoHideSplash() after first paint, OR

      (function(){
        var splash = document.getElementById('pulso-splash');
        if (!splash) return;
        var hidden = false;
        var startedAt = Date.now();
        var MIN_SHOW_MS = 350;

        function doHide(){
          if (hidden) return; hidden = true;
          splash.classList.add('pulso-hide');
          setTimeout(function(){
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }
        function hide(){
          var elapsed = Date.now() - startedAt;
          if (elapsed < MIN_SHOW_MS) {
            setTimeout(doHide, MIN_SHOW_MS - elapsed);
          } else {
            doHide();
          }
        }

        window.__pulsoHideSplash = hide;

        // Fallback: hide as soon as React renders ANY content into root

            }

        // fails, keep the branded recovery UI visible instead of a blank screen.
        setTimeout(function(){
          if (root && root.childNodes.length > 0) hide();
        }, 4500);

        function showError(reason){
          if (!splash || !splash.parentNode) return;
          splash.classList.remove('pulso-hide');
          splash.style.opacity = '1';
          splash.style.visibility = 'visible';
          splash.innerHTML = '<div style="text-align:center;font-family:-apple-system,sans-serif;color:#0a1628;padding:24px;max-width:340px"><div style="font-weight:800;letter-spacing:.2em;font-size:20px;margin-bottom:12px;color:#0a6dd9">PULSO</div><div style="font-size:14px;line-height:1.5;margin-bottom:16px">Não foi possível carregar o aplicativo. Toque em recarregar para tentar novamente.</div><button id="pulso-reload" style="background:#0a6dd9;color:#fff;border:0;padding:12px 24px;border-radius:10px;font-weight:600;font-size:14px">Recarregar</button><div style="font-size:10px;color:#64748b;margin-top:12px;opacity:.7">' + (reason || '') + '</div></div>';
          var btn = document.getElementById('pulso-reload');
          if (btn) btn.onclick = function(){
            try {
              if ('caches' in window) caches.keys().then(function(k){ k.forEach(function(n){ caches.delete(n); }); });
              if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(r){ r.forEach(function(x){ x.unregister(); }); });
            } catch(e) {}
            setTimeout(function(){ location.reload(); }, 150);
          };
        }

        // If the JS bundle itself errors out (e.g. TDZ in a vendor chunk),
        // show the recovery screen IMMEDIATELY instead of waiting 10s.
        window.addEventListener('error', function(ev){
          if (root && root.childNodes.length === 0) {
            showError(ev && ev.message ? ev.message : 'Erro de carregamento');
          }

        window.addEventListener('unhandledrejection', function(ev){
          if (root && root.childNodes.length === 0) {
            var msg = ev && ev.reason && ev.reason.message ? ev.reason.message : 'Falha ao carregar';
            showError(msg);
          }
        });

        // Last-resort: if main script fails to ever render anything in 8s
        setTimeout(function(){
          if (root && root.childNodes.length === 0) showError('Tempo esgotado');
        }, 8000);
      })();

                      caches.keys().then(function(keys){
                        Promise.all(keys.map(function(k){ return caches.delete(k).catch(function(){ return false; }); }))
                          .then(function(results){
                            emit('cache_purge_completed', { caches_cleared: results.filter(Boolean).length, source: 'inline_probe' });
                          });
                      });
                    }
                  } catch(e) {
                    emit('cache_purge_failed', { message: String(e && e.message || e) });
                  }
                  var next = new URL(location.href);
                  next.searchParams.set('v', Date.now().toString());
                  emit('version_reload_triggered', { remote_build: data.buildId, source: 'inline_probe_fallback' });
                  location.replace(next.toString());
                  return;
                }
                setTimeout(waitForReact, 500);
              })();
            })
            .catch(function(err){
              emit('version_check_failed', { reason: 'network', message: String(err && err.message || err) });
            });
        } catch(e) {
          emit('version_check_failed', { reason: 'exception', message: String(e && e.message || e) });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
